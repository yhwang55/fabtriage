<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FabTriage Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF0EE;
  --panel: #FAFBFA;
  --ink: #18262B;
  --muted: #5F6F73;
  --line: #CBD3D1;
  --amber: #D99A0B;
  --amber-soft: #FBF0D2;
  --hold: #B93A2E;
  --hold-soft: #F6E1DE;
  --release: #2E7A57;
  --release-soft: #DCEEE5;
  --slate: #3E5A66;
  --head: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- top bar ---------- */
header.top {
  display: flex; align-items: baseline; gap: 28px; padding: 14px 24px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font: 700 22px/1 var(--head); letter-spacing: .01em; }
.brand small { font: 500 14px var(--body); color: var(--muted); margin-left: 10px; letter-spacing: 0; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button {
  border: 0; background: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 500;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.lang { display: flex; margin-left: 14px; border: 1px solid var(--line); border-radius: 2px; align-self: center; }
.lang button { border: 0; background: none; padding: 3px 9px; cursor: pointer; color: var(--muted); font: 600 13px var(--head); letter-spacing: .03em; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
:lang(ko) body { word-break: keep-all; }

/* ---------- three columns ---------- */
main.console { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; height: calc(100vh - 53px - var(--banner, 0px)); }
.col { overflow-y: auto; }
.col.list { border-right: 1px solid var(--line); background: var(--panel); }
.col.side { border-left: 1px solid var(--line); background: var(--panel); padding: 20px; }
@media (max-width: 1100px) {
  main.console { grid-template-columns: 1fr; height: auto; }
  .col.list, .col.side { border: 0; border-bottom: 1px solid var(--line); }
  .col.list { max-height: 240px; }
}

/* ---------- alarm list ---------- */
.group { padding: 14px 16px 4px; color: var(--muted); font: 600 13px var(--head); }
.alarm-row {
  display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: center; width: 100%;
  border: 0; border-left: 3px solid transparent; background: none; text-align: left; padding: 8px 14px 8px 13px; cursor: pointer;
}
.alarm-row:hover { background: var(--paper); }
.alarm-row[aria-current="true"] { background: var(--paper); border-left-color: var(--amber); }
.kind { font: 700 14px var(--head); letter-spacing: .02em; }
.kind.OOS { color: var(--hold); }
.kind.OOC { color: #8A6100; }
.kind.FDC { color: var(--slate); }
.alarm-row .what { line-height: 1.25; }
.alarm-row .what b { font-weight: 600; display: block; }
.alarm-row .what span { color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.dot.awaiting_signoff { background: transparent; }
.dot.approve { background: var(--release); }
.dot.reject, .dot.needs_engineer { background: var(--hold); }
.dot.live { background: var(--amber); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }

/* ---------- center: the traveler ---------- */
.traveler { padding: 22px 32px 60px; max-width: 860px; }
.alarm-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end; }
.alarm-head h1 { margin: 0; font: 600 30px/1.1 var(--head); }
.alarm-head .sub { color: var(--muted); }
.reading { text-align: right; }
.reading .num { font: 700 44px/1 var(--head); }
.reading .num small { font-size: 20px; font-weight: 500; margin-left: 2px; }
.gauge { grid-column: 1 / -1; margin-top: 10px; }
.methods { display: flex; gap: 6px; align-items: center; margin: 22px 0 6px; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 18px; margin-right: 12px; border-bottom: 1px solid var(--line); }
.seg button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; padding: 6px 0; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--panel); padding: 6px 14px; border-radius: 2px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: none; color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.approve { background: var(--release); border-color: var(--release); }
.btn.reject { background: none; color: var(--hold); border-color: var(--hold); }
.methods .note { color: var(--muted); font-size: 13px; margin-left: 6px; }

.empty { margin-top: 30px; color: var(--muted); }
ol.route { list-style: none; margin: 18px 0 0; padding: 0; position: relative; }
.step { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.step .n { font: 600 15px/1.6 var(--head); color: var(--muted); text-align: right; }
.step.flash .body { background: var(--amber-soft); }
.step .body { padding: 0 8px; margin-left: -8px; transition: background .6s; }
.step .title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.step .title b { font-weight: 600; }
.chip { font: 600 14px var(--head); color: var(--slate); cursor: pointer; }
.chip:hover { text-decoration: underline; }
.finding { color: var(--ink); margin-top: 2px; }
.finding .soft { color: var(--muted); }
.thought { color: var(--slate); font-style: italic; margin: 2px 0 4px; }
details.raw summary { color: var(--muted); font-size: 13px; cursor: pointer; width: fit-content; }
details.raw pre { font-size: 12px; background: var(--paper); padding: 8px; border-radius: 4px; overflow-x: auto; max-height: 260px; }
.mini { border-collapse: collapse; margin-top: 4px; font-size: 13px; }
.mini td, .mini th { padding: 1px 10px 1px 0; text-align: left; font-weight: 400; }
.mini th { color: var(--muted); }
.mini .hi { color: var(--hold); font-weight: 600; }

.step.refused .n, .step.refused .title b { color: var(--hold); }
.step.refused ul { margin: 4px 0 2px; padding-left: 18px; }
.step.final .n { color: var(--ink); }

.disposition { margin-top: 6px; }
.cause { font: 600 22px var(--head); }
.actions { margin: 6px 0 10px; }
.act { font-weight: 600; color: var(--slate); }
.act.hold_lot, .act.hold_chamber { color: var(--hold); }
.act.release_lot { color: var(--release); }
.claims { margin: 0; padding: 0; list-style: none; }
.claims li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 3px 0; }
.summary { margin-top: 10px; max-width: 70ch; }
.signoff { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.signoff textarea { width: 100%; max-width: 560px; min-height: 64px; border: 1px solid var(--line); border-radius: 2px; padding: 8px; background: var(--panel); display: block; margin: 8px 0; }
.soft { color: var(--muted); }
.signoff .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stamp { font: 700 17px var(--head); }
.stamp.approve { color: var(--release); }
.stamp.reject { color: var(--hold); }
.history { margin-top: 14px; color: var(--muted); font-size: 14px; }


/* ---------- verdict card ---------- */
.verdict { margin: 26px 0 8px; padding: 0 0 4px; }
.verdict .vhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.verdict .vlabel { font: 700 46px/1 var(--head); color: var(--slate); }
.verdict.stop .vlabel { color: var(--hold); }
.verdict.go .vlabel { color: var(--release); }
.verdict.pending .vlabel { color: #8A6100; font-size: 30px; }
.verdict h2 { font: 600 26px/1.15 var(--head); margin: 0; }
.verdict .actions { font-size: 16px; margin: 8px 0 6px; }
.verdict .summary { margin: 6px 0 8px; }
.verdict details summary { color: var(--slate); cursor: pointer; font-size: 14px; width: fit-content; margin-top: 4px; }
.verdict .vmeta { color: var(--muted); font-size: 13px; margin-top: 10px; }
.verdict .signoff { margin-top: 12px; }
.routehead { font: 600 17px var(--head); margin: 26px 0 0; color: var(--slate); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--slate); text-decoration: underline; cursor: pointer; font-size: 14px; }

/* ---------- side panel ---------- */
.side h2 { font: 600 16px var(--head); margin: 0 0 6px; }
.side section { margin-bottom: 24px; }
.side .cap { color: var(--muted); font-size: 13px; }
.maps { display: flex; gap: 10px; flex-wrap: wrap; }
.maps figure { margin: 0; width: 150px; }
.maps img { width: 150px; height: 150px; display: block; }
.maps figcaption { font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 3px; }
.costs { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; }
.costs span:nth-child(odd) { color: var(--muted); }
.truth { border-top: 1px solid var(--line); padding-top: 8px; }
.refs { margin: 6px 0 0; padding-left: 16px; font-size: 13px; color: var(--muted); }
.refs a { color: var(--slate); }
svg text { font: 11px var(--body); fill: var(--muted); }


.demobanner { background: var(--panel); color: var(--muted); padding: 0 24px 8px; font-size: 13px; border-bottom: 1px solid var(--line); margin-top: -1px; }
.demobanner a { color: var(--slate); }

/* ---------- glossary tooltips and guide ---------- */
.term { position: relative; cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.kind.term, .chip.term, .vlabel.term { text-decoration: none; }
.term:hover::after, .term:focus-visible::after {
  content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: max-content; max-width: 280px;
  background: var(--ink); color: var(--panel); font: 400 13px/1.4 var(--body); padding: 7px 10px; border-radius: 2px;
  white-space: normal; text-align: left;
}
.guide { margin: 0 0 28px; max-width: 68ch; font-size: 16px; }
.guide h2 { font: 600 20px var(--head); margin: 0 0 6px; }
.guide p { margin: 0 0 8px; }
.guide .close { border: 0; background: none; padding: 0; cursor: pointer; color: var(--slate); text-decoration: underline; font-size: 14px; }
.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; margin-top: 8px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; color: var(--muted); }
nav.tabs button.help { border: 1px solid var(--line); }

/* ---------- alarm queue ---------- */
.shift { padding: 24px 32px 60px; max-width: 1180px; }
.shift h1 { font: 600 28px var(--head); margin: 0 0 4px; }
.shift p.lead { color: var(--muted); margin: 0 0 16px; max-width: 75ch; }
.counts { font-size: 17px; margin: 4px 0 20px; max-width: 75ch; }
.counts b { font: 700 22px var(--head); }
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.filters select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); }
table.queue { border-collapse: collapse; width: 100%; background: var(--panel); }
table.queue th, table.queue td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.queue th { font-weight: 500; color: var(--muted); font-size: 14px; }
table.queue tr.row { cursor: pointer; }
table.queue tr.row:hover td { background: var(--paper); }
.status { font-size: 14px; font-weight: 500; }
.status.awaiting_signoff { color: #8A6100; }
.status.approve { color: var(--release); }
.status.reject, .status.needs_engineer, .status.error, .status.turn_limit { color: var(--hold); }
@media (max-width: 800px) { table.queue .opt { display: none; } }

/* ---------- side by side ---------- */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 10px; }
.pair h3 { font: 600 18px var(--head); margin: 8px 0 0; }
.pair .verdict { margin-top: 8px; }
.pair .verdict h2 { font-size: 20px; }
.pair .verdict .vlabel { font-size: 34px; }
.diffline { margin-top: 18px; font-size: 17px; }
.diffline b { color: #8A6100; }
ol.mini-route { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }
ol.mini-route li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
ol.mini-route li b { font-weight: 600; }
ol.mini-route li.refused { color: var(--hold); }
@media (max-width: 1100px) { .pair { grid-template-columns: 1fr; } }

/* ---------- benchmark ---------- */
.bench { padding: 24px 32px 60px; max-width: 1100px; }
.bench h1 { font: 600 28px var(--head); margin: 0 0 4px; }
.bench p.lead { color: var(--muted); margin: 0 0 18px; max-width: 75ch; }
.bench h2 { font: 600 19px var(--head); margin: 26px 0 8px; }
table.sum { border-collapse: collapse; width: 100%; background: var(--panel); }
table.sum th, table.sum td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; }
table.sum th:first-child, table.sum td:first-child { text-align: left; }
table.sum th { font-weight: 500; color: var(--muted); }
table.sum tr.agent td { font-weight: 600; }
.bar { display: inline-block; height: 8px; background: var(--ink); margin-right: 8px; vertical-align: middle; }
.grid { border-collapse: collapse; background: var(--panel); }
.grid th, .grid td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.grid th { font-weight: 500; color: var(--muted); }
.cell { display: inline-flex; gap: 3px; }
.sq { width: 14px; height: 14px; border-radius: 2px; display: inline-block; background: var(--line); }
.sq.ok { background: var(--release); }
.sq.bad { background: var(--hold); }
.legend { color: var(--muted); font-size: 13px; margin: 6px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">FabTriage<small data-i18n="tagline">Alarm investigation, CVD deposition</small></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="shift" data-i18n="tab_shift">Alarm queue</button>
    <button role="tab" aria-selected="false" data-view="console" data-i18n="tab_console">Investigations</button>
    <button role="tab" aria-selected="false" data-view="recovery" data-i18n="tab_recovery">Recovery after PM</button>
    <button role="tab" aria-selected="false" data-view="bench" data-i18n="tab_bench">Benchmark</button>
  </nav>
  <div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="ko" aria-pressed="false">KR</button></div>
</header>

<div id="demobanner" class="demobanner" hidden><span data-i18n="banner">Read-only demo built from saved runs. Live investigations, sign-off and voice notes run in the local version:</span> <a href="https://github.com/yhwang55/fabtriage">github.com/yhwang55/fabtriage</a></div>
<main id="shift" class="shift"></main>
<main class="console" id="console" hidden>
  <div class="col list" id="list" aria-label="Alarms"></div>
  <div class="col"><div class="traveler" id="traveler"></div></div>
  <aside class="col side" id="side"></aside>
</main>
<main class="console" id="recovery" hidden>
  <div class="col list" id="rlist" aria-label="Recoveries"></div>
  <div class="col"><div class="traveler" id="rtraveler"></div></div>
  <aside class="col side" id="rside"></aside>
</main>
<main id="bench" class="bench" hidden></main>

<script>
let LANG = "en";
try {
  const q = new URLSearchParams(location.search).get("lang");
  LANG = q === "ko" || q === "kr" ? "ko" : q === "en" ? "en" : localStorage.getItem("fabtriage-lang") || "en";
} catch (e) {}
const KO = () => LANG === "ko";
const L = (en, ko) => (KO() ? ko : en);
const UI = {
  tagline: ["Alarm investigation, CVD deposition", "CVD 증착 공정 알람 조사"],
  tab_shift: ["Alarm queue", "알람 대기열"],
  tab_console: ["Investigations", "조사 기록"],
  tab_bench: ["Benchmark", "성능 비교"],
  tab_recovery: ["Recovery after PM", "PM 후 복구"],
  banner: ["Read-only demo built from saved runs. Live investigations, sign-off and voice notes run in the local version:",
    "저장된 실행 기록으로 만든 읽기 전용 데모입니다. 실시간 조사, 승인, 음성 메모는 로컬 버전에서 쓸 수 있습니다:"],
};
function applyStatic() {
  document.documentElement.lang = KO() ? "ko" : "en";
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = UI[el.dataset.i18n][KO() ? 1 : 0];
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === LANG);
}
const TOOL_NAMES_KO = {
  get_alarm: "알람 확인", get_lot_history: "lot 이력 추적", query_lots: "최근 lot 조회", get_chamber_summary: "챔버끼리 비교",
  get_trend: "추세 확인", run_commonality: "공통성 분석", get_fdc_summary: "FDC 센서 확인", get_pm_log: "PM 기록 확인",
  request_measurement: "재측정 요청", get_wafer_map: "웨이퍼 맵 분할", submit_disposition: "처분안 제출",
};
const CAUSES_KO = { chamber: "증착 챔버 이상", metrology: "계측 오측정", upstream: "앞 공정(세정) 문제", noise: "일회성 웨이퍼 편차", sensor: "FDC 센서 고장" };
const ACTIONS_KO = {
  hold_lot: "lot 홀드", release_lot: "lot 진행", hold_chamber: "챔버 홀드",
  escalate_upstream: "앞 공정에 이관", hold_metrology_tool: "계측 장비 홀드", flag_sensor: "센서 점검 요청",
};
const METHOD_NAMES_KO = { agent: "에이전트", playbook: "고정 규칙", always_hold: "무조건 홀드", compare: "나란히 비교" };
const STATUS_TEXT_KO = {
  awaiting_signoff: "승인 대기", approve: "승인됨", reject: "반려, 재조사 요청",
  needs_engineer: "엔지니어 확인 필요", turn_limit: "중간에 멈춤", error: "중간에 멈춤", running: "조사 중",
};
const BENCH_NAMES_KO = {
  agent: "에이전트 (Muse Spark 1.3)", agent_baseten: "에이전트 (Muse Spark Open)", agent_noverify: "검증기 없는 에이전트",
  oneshot: "같은 모델, 도구 없이 한 번에 답변", playbook: "고정 규칙", always_hold: "무조건 홀드",
};
const PATTERNS_KO = { none: "두꺼운 영역 없음", center: "중앙이 두꺼움", edge_ring: "가장자리 링", edge_arc: "가장자리 일부", local_spot: "국소 반점", multiple: "두꺼운 영역 여러 곳", most_of_wafer: "웨이퍼 대부분이 두꺼움", wafer_wide: "웨이퍼 전반" };
const SCENARIO_KO = { pm_shift: "PM 후 변화", buildup_drift: "증착물 누적 드리프트", metrology_error: "계측 오류", upstream_clean: "앞 공정 세정", wafer_noise: "웨이퍼 단발 편차", sensor_fault: "센서 고장", heater_drift: "히터 드리프트" };
const ASSUME_KO = {
  engineer_hours_per_manual_investigation: "현직 팹 데이터 사이언티스트에게 들은 바로는 오경보 홀드는 보통 2~3시간이면 풀립니다.",
  engineer_hours_per_review: "근거가 달린 처분안을 읽고 승인하거나 반려하는 데 약 10분 (우리 추정).",
  lot_hours_per_needless_hold: "불필요하게 홀드된 lot은 그 홀드를 푸는 조사 시간만큼 기다립니다.",
  lots_at_risk_per_missed_fault: "시뮬레이터에서는 lot의 절반 정도만 측정하므로, 놓친 챔버 이상은 다음 측정 웨이퍼가 잡기 전까지 lot 두 개쯤 더 흘러갑니다.",
};
const toolName = (t) => (KO() ? TOOL_NAMES_KO[t] : TOOL_NAMES[t]) || t;

    state.run = a.run; state.pair = [a.run, b.run]; state.sources = a.sources;

function gauge(value, L, type) {
  if (type === "FDC") return "";
  const lo = L.lsl - 8, hi = L.usl + 8, W = 600;
  const x = (v) => ((Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * W;
  return `<svg class="gauge" viewBox="0 0 ${W} 34" width="100%" height="34" role="img" aria-label="Reading against limits">
    <rect x="0" y="12" width="${W}" height="10" fill="var(--hold-soft)"/>
    <rect x="${x(L.lsl)}" y="12" width="${x(L.usl) - x(L.lsl)}" height="10" fill="var(--amber-soft)"/>
    <rect x="${x(L.lcl)}" y="12" width="${x(L.ucl) - x(L.lcl)}" height="10" fill="var(--release-soft)"/>
    <line x1="${x(L.target)}" x2="${x(L.target)}" y1="10" y2="24" stroke="var(--muted)"/>
    <text x="${x(L.lsl)}" y="34" text-anchor="middle">LSL ${L.lsl}</text>
    <text x="${x(L.usl)}" y="34" text-anchor="middle">USL ${L.usl}</text>
    <text x="${x(L.target)}" y="8" text-anchor="middle">${KO() ? "목표" : "target"}</text>
    <path d="M${x(value) - 6},4 L${x(value) + 6},4 L${x(value)},12 Z" fill="var(--ink)"/>
    <line x1="${x(value)}" x2="${x(value)}" y1="12" y2="22" stroke="var(--ink)" stroke-width="2"/>
  </svg>`;
}

function finding(s) {

  if (r.error) return `<span class="soft">Refused: ${esc(r.error)}</span>`;
  switch (s.tool) {
    case "get_alarm": return `${esc(r.alarm.type)} on ${esc(r.alarm.chamber)}, read ${fmt(r.alarm.value)} on ${esc(r.alarm.met_tool || r.alarm.parameter)}.`;
    case "get_lot_history": return `${esc(r.lot_id)} went ${esc(r.clean_tool)}, then ${esc(r.chamber)}${r.met_tool ? ", then " + esc(r.met_tool) : ""}. ${r.wafers_since_pm_on_chamber} wafers since PM on that chamber.`;
    case "query_lots": return `${r.n} lots${a.chamber ? " on " + esc(a.chamber) : ""}${a.clean_tool ? " from " + esc(a.clean_tool) : ""}${a.met_tool ? " measured on " + esc(a.met_tool) : ""} in the last ${a.window_hours || 12} h.`;
    case "get_chamber_summary": {

    }
    case "get_pm_log": return `PM ${r.events.length}건${a.chamber ? " (" + esc(a.chamber) + ")" : ""}, 마지막은 ${r.events.length ? r.events[r.events.length - 1].time_h + "시간" : "없음"}.`;
    case "request_measurement": return `${esc(r.lot_id)}을 ${esc(r.met_tool)}에서 측정: <b>${fmt(r.mean_A)} Å</b>, ${r.in_spec ? "규격 안" : "규격 밖"}. lot 지연 ${r.lot_delay_added_h}시간 추가.`;
    case "get_wafer_map": return `${esc(r.lot_id)}: ${pattern(r.pattern)}, ${esc(r.segmenter)}로 분할.`;
    default: return "";
  }
}

function alarmHeader(c, live, run) {
  const a = c.alarm, L_ = state.ctx.limits;
  const reading = a.type === "FDC" ? `${fmt(a.value, 1)}<small>°C</small>` : `${fmt(a.value)}<small>Å</small>`;
  const methodBtns = Object.keys(METHOD_NAMES).map((m) => `<button aria-pressed="${m === state.method}" data-m="${m}">${methodName(m)}</button>`).join("");
  const heldOut = c.split !== "dev";
  const canRun = state.method === "agent" && state.liveEnabled && !live && !heldOut;
  return `<div class="alarm-head">
      <div><h1>${esc(a.chamber)}, ${esc(a.lot_id)}</h1>
      <div class="sub">${KO()
        ? `${term(a.type)} ${a.type === "FDC" ? "알람, " + esc(a.parameter) + " 3시그마 초과" : a.type === "OOS" ? `웨이퍼 평균이 규격 ${L_.lsl}~${L_.usl} 밖` : `웨이퍼 평균이 관리 한계 ${L_.lcl}~${L_.ucl} 밖`}. ${a.time_h}시간에 ${esc(a.alarm_id)} 발생.`
        : `${term(a.type)} ${a.type === "FDC" ? "alarm, " + esc(a.parameter) : esc(a.rule)}. Raised at ${a.time_h} h by ${esc(a.alarm_id)}.`}</div></div>
      <div class="reading"><div class="num">${reading}</div></div>
      ${gauge(a.value, L_, a.type)}
    </div>
    <div class="methods"><div class="seg" role="group" aria-label="Who investigated">${methodBtns}</div>
      ${run && state.method !== "compare" ? `<button class="btn ghost" id="replay">${state.replay != null ? L("Stop replay", "재생 멈추기") : L("Replay the investigation", "조사 다시 보기")}</button>` : ""}
      ${state.method === "agent" && !STATIC ? `<button class="btn ghost" id="runlive" ${canRun ? "" : "disabled"}>${heldOut ? L("Held out for the final benchmark", "최종 평가용으로 남겨 둔 알람") : live ? L("Investigating…", "조사 중…") : run ? L("Investigate again", "다시 조사") : L("Investigate live", "실시간 조사")}</button>` : ""}
      ${state.method === "agent" && !STATIC && !state.liveEnabled ? `<span class="note">${L("Add MODEL_API_KEY to .env to run live.", "실시간 조사를 하려면 .env에 MODEL_API_KEY를 넣으세요.")}</span>` : ""}
    </div>`;
}

function renderTraveler(live) {
  const c = state.cases.find((x) => x.case_id === state.caseId);
  if (!c) { $("#traveler").innerHTML = `<p class="empty">${L("Pick an alarm on the left to see how it was investigated.", "왼쪽에서 알람을 고르면 조사 과정을 볼 수 있습니다.")}</p>`; return; }
  const run = state.run;
  let html = alarmHeader(c, live, run);
  if (!run) {
    html += `<p class="empty">${live ? L("Starting the investigation…", "조사를 시작하는 중…") : L(`No ${METHOD_NAMES[state.method].toLowerCase()} run for this alarm yet.`, `이 알람에는 아직 ${methodName(state.method)} 실행 기록이 없습니다.`)}</p>`;
    $("#traveler").innerHTML = html;
    bindTraveler();
    return;
  }
  const notesAt = {};
  for (const n of run.notes || []) (notesAt[n.step ?? n.turn] ||= []).push(n.text);
  const evStep = {};
  run.trace.forEach((s, i) => { if (s.result && s.result.evidence_id) evStep[s.result.evidence_id] = i + 1; });
  const replaying = state.replay != null && state.replay < run.trace.length;
  const shown = replaying ? run.trace.slice(0, state.replay) : run.trace;
  html += replaying
    ? `<section class="verdict pending" aria-live="polite"><div class="vhead"><span class="vlabel">${L("Replaying", "재생 중")}</span><h2>${L(`Step ${state.replay} of ${run.trace.length}`, `${run.trace.length}단계 중 ${state.replay}단계`)}</h2></div><p class="summary">${L("The verdict appears when the verifier accepts it.", "검증기가 받아들이면 결론이 나타납니다.")}</p></section>`
    : verdictCard(run, evStep, !live, live);
  html += `<h3 class="routehead">${L("How it got there", "결론까지의 과정")}</h3><ol class="route">`;
  shown.forEach((s, i) => {
    const n = i + 1, r = s.result || {};
    if (r.evidence_id) evStep[r.evidence_id] = n;
    const thought = (notesAt[n] || []).map((t) => `<div class="thought">${esc(t)}</div>`).join("");
    if (s.tool === "submit_disposition") {
      if (r.accepted) {
        html += `<li class="step final" id="step-${n}"><span class="n">${n}</span><div class="body">${thought}
          <div class="title"><b>${L("Filed a disposition", "처분안 제출")}</b><span class="soft">${L("passed the verifier", "검증 통과")}</span></div>
          <div class="finding"><button class="linkbtn" data-top="1">${L("See the verdict at the top", "맨 위 결론 보기")}</button></div></div></li>`;
      } else {
        const probs = (r.problems || []).map((p) => `<li>${esc(p.replace(/^rule: /, ""))}</li>`).join("");
        html += `<li class="step refused" id="step-${n}"><span class="n">${n}</span><div class="body">${thought}
          <div class="title"><b>${KO() ? `${term("Verifier", "검증기")}가 처분안을 거부함` : `${term("Verifier")} refused the disposition`}</b></div><ul>${probs}</ul>
          <details class="raw"><summary>${L("What the agent tried to file", "에이전트가 제출하려던 내용")}</summary><pre>${esc(JSON.stringify(s.args, null, 1))}</pre></details></div></li>`;
      }
      return;
    }
    let label = trendLabel(s);
    if (KO()) {
      if (s.tool === "run_commonality") label = `${term("Commonality analysis", "공통성 분석")} 실행`;
      if (s.tool === "get_pm_log") label = `${term("PM")} 기록 확인`;
      if (s.tool === "get_fdc_summary") label = `${term("FDC")} 센서 확인`;
      if (s.tool === "request_measurement") label = `${term("Metrology", "재측정")} 요청`;
    } else {
      if (s.tool === "run_commonality") label = `Ran ${term("Commonality analysis", "commonality analysis")}`;
      if (s.tool === "get_pm_log") label = `Read the ${term("PM")} log`;
      if (s.tool === "get_fdc_summary") label = `Checked ${term("FDC")} sensors`;
      if (s.tool === "request_measurement") label = `Requested a ${term("Metrology", "measurement")}`;
    }
    html += `<li class="step" id="step-${n}"><span class="n">${n}</span><div class="body">${thought}
      <div class="title"><b>${label}</b>${r.evidence_id ? `<span class="chip" data-step="${n}" title="${esc(gloss("Evidence id"))}">${r.evidence_id}</span>` : ""}</div>
      <div class="finding">${finding(s)}</div>
      <details class="raw"><summary>${L("Raw result", "원본 결과")}</summary><pre>${esc(JSON.stringify(r, null, 1))}</pre></details></div></li>`;
  });
  html += `</ol>`;
  if (live) html += `<p class="empty">${L("Investigating…", "조사 중…")}</p>`;
  if ((run.history || []).length) {
    html += `<div class="history">${L("Earlier dispositions for this alarm", "이 알람의 이전 처분안")}: ${run.history.map((h) =>
      `${esc(causeName(h.disposition.cause))}${h.signoff ? ", " + esc(KO() ? (h.signoff.decision === "approve" ? "승인" : "반려") : h.signoff.decision + "d") + (h.signoff.note ? ` ("${esc(h.signoff.note)}")` : "") : ""}`).join("; ")}.</div>`;
  }
  $("#traveler").innerHTML = html;
  bindTraveler();
}

function decisionText(run) {
  if (!run || !run.disposition) return L("no decision", "결정 없음");
  return run.disposition.actions.map((x) => `${KO() ? actionName(x.type) : (ACTIONS[x.type] || x.type).toLowerCase()} ${x.target}`).join(", ");
}
function miniRoute(run) {
  if (!run) return "";
  return `<ol class="mini-route">${run.trace.map((s, i) => {
    const r = s.result || {};
    if (s.tool === "submit_disposition") return `<li class="${r.accepted ? "" : "refused"}"><b>${i + 1}. ${r.accepted ? L("Filed the disposition", "처분안 제출") : L("Verifier refused the disposition", "검증기가 처분안을 거부함")}</b></li>`;
    const label = trendLabel(s);
    return `<li><b>${i + 1}. ${label}.</b> ${finding(s)}</li>`;
  }).join("")}</ol>`;
}
function trendLabel(s) {
  if (s.tool === "get_trend") return KO() ? `${esc(s.args.chamber)}의 ${esc(s.args.signal)} 추세 확인` : `Pulled ${esc(s.args.signal)} on ${esc(s.args.chamber)}`;
  return toolName(s.tool);
}
function renderCompare() {
  const c = state.cases.find((x) => x.case_id === state.caseId);
  const [A, P] = state.pair;
  let html = alarmHeader(c, false, A);
  const key = (r) => JSON.stringify(((r && r.disposition && r.disposition.actions) || []).map((x) => x.type + ":" + x.target).sort());
  if (A && P) {
    const same = key(A) === key(P);
    html += `<div class="diffline ${same ? "same" : ""}">${same
      ? L("Both reached the same decision.", "둘 다 같은 결정을 내렸습니다.")
      : L(`<b>Different decisions.</b> The agent would ${esc(decisionText(A))}. The fixed playbook would ${esc(decisionText(P))}.`,
          `<b>결정이 다릅니다.</b> 에이전트: ${esc(decisionText(A))}. 고정 규칙: ${esc(decisionText(P))}.`)}</div>`;
  }
  const col = (title, run, note) => `<div><h3>${title}</h3>${run ? verdictCard(run, {}, false, false) + `<div class="routehead" style="margin-top:12px;font-size:15px">${note}</div>` + miniRoute(run) : `<p class="empty">${L("No run yet.", "아직 실행 기록이 없습니다.")}</p>`}</div>`;
  html += `<div class="pair">${col(methodName("agent"), A, L("What it looked at, in the order it chose", "에이전트가 스스로 정한 순서대로 본 것"))}${col(methodName("playbook"), P, L("The same checks every time, then fixed thresholds", "매번 같은 확인, 그다음 고정 기준값"))}</div>`;
  $("#traveler").innerHTML = html;
  bindTraveler();
}

/* ---------------- alarm queue ---------------- */
function queueRank(r) {
  if (!r) return 5;
  if (r.live) return 0;
  const st = r.signoff || r.status;
  if (["needs_engineer", "turn_limit", "error", "reject"].includes(st)) return 1;
  if (st === "awaiting_signoff") return (r.actions || []).some((x) => x.startsWith("hold")) ? 2 : 3;
  return 4;
}
function renderShift() {
  const split = state.queueSplit || "dev";
  const cs = state.cases.filter((c) => split === "all" || c.split === split);
  const n = (f) => cs.filter((c) => f(c.runs.agent)).length;
  const waiting = n((r) => r && r.status === "awaiting_signoff" && !r.signoff);
  const attn = n((r) => r && ["needs_engineer", "turn_limit", "error"].includes(r.status) || (r && r.signoff === "reject"));
  const done = n((r) => r && r.signoff === "approve");
  const holds = n((r) => r && (r.actions || []).some((x) => x.startsWith("hold")) && !r.signoff);
  const rows = cs.slice().sort((x, y) => queueRank(x.runs.agent) - queueRank(y.runs.agent));
  let html = guideHtml() + (KO() ? `<h1>알람 대기열</h1>
    <p class="lead">여기 있는 알람은 모두 에이전트가 조사했습니다. 위에서부터 보면 됩니다. 사람이 봐야 하는 알람, 홀드 제안, 진행 제안 순서입니다. 알람마다 가상 팹 이력이 따로 있습니다.</p>
    <p class="counts">승인 대기 <b>${waiting}</b>건, 그중 홀드 제안 <b>${holds}</b>건. 엔지니어 확인 필요 <b>${attn}</b>건, 승인 완료 <b>${done}</b>건.</p>` : `<h1>Alarm queue</h1>
    <p class="lead">Every alarm here was investigated by the agent. Start at the top: alarms that need you come first, then proposed holds, then proposed releases. Each alarm is its own simulated fab history.</p>
    <p class="counts"><b>${waiting}</b> waiting for your sign-off, <b>${holds}</b> of them proposing a hold. <b>${attn}</b> need an engineer, <b>${done}</b> approved.</p>`) + `
    <div class="filters"><label for="qsplit">${L("Alarm set", "알람 세트")}</label>
      <select id="qsplit">${(KO() ? [["dev", "개발 세트"], ["holdout", "평가 세트"], ["holdout2", "새 평가 세트"], ["all", "전체"]] : [["dev", "Development"], ["holdout", "Held-out"], ["holdout2", "Fresh held-out"], ["all", "All"]]).map(([v, t]) => `<option value="${v}" ${v === split ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <table class="queue"><tr><th>${L("Alarm", "알람")}</th><th>${term("Chamber", L("Chamber", "챔버"))}</th><th>${L("Reading", "측정값")}, ${term("Å")}</th><th>${L("Agent's call", "에이전트 판단")}</th><th class="opt">${L("Proposed actions", "제안 조치")}</th><th>${L("Status", "상태")}</th></tr>`;
  for (const c of rows) {
    const a = c.alarm, r = c.runs.agent;
    const st = r ? (r.live ? "running" : r.signoff || r.status) : "";
    const val = a.type === "FDC" ? `${fmt(a.value, 1)} °C` : `${fmt(a.value)} Å`;
    html += `<tr class="row" data-case="${c.case_id}" tabindex="0">
      <td><span style="display:inline-block;width:38px">${term(a.type, a.type, "kind " + a.type)}</span> <span class="soft">${esc(a.alarm_id)}</span></td>
      <td>${esc(a.chamber)}</td><td>${val}</td>
      <td>${r && r.cause ? esc(causeName(r.cause)) : `<span class="soft">${L("not investigated", "조사 안 함")}</span>`}</td>
      <td class="opt">${r ? (r.actions || []).map((x) => `<span class="act ${x}">${actionName(x)}</span>`).join(", ") : ""}</td>
      <td><span class="status ${st}">${statusText(st)}</span></td></tr>`;
  }
  html += `</table><details style="margin-top:18px"><summary>${L("Glossary", "용어 설명")}</summary>${glossaryHtml()}</details>`;
  $("#shift").innerHTML = html;
  const gc = $("#guideclose");
  if (gc) gc.onclick = () => { try { localStorage.setItem("fabtriage-guide", "closed"); } catch (e) {} $("#guide").remove(); };
  $("#qsplit").onchange = (e) => { state.queueSplit = e.target.value; renderShift(); };
  for (const tr of document.querySelectorAll("tr.row")) {
    const open = () => { state.method = "agent"; showView("console"); selectCase(tr.dataset.case); };
    tr.onclick = open;
    tr.onkeydown = (e) => { if (e.key === "Enter") open(); };
  }
}

function verdictCard(run, evStep, withSignoff, live) {
  if (!run) return "";
  const c = run.costs || {}, d = run.disposition;
  if (live && run.status === "running") {
    return `<section class="verdict pending" aria-live="polite"><div class="vhead"><span class="vlabel">${L("Investigating", "조사 중")}</span><h2>${L(`${run.trace.length} steps so far`, `지금까지 ${run.trace.length}단계`)}</h2></div>
      <p class="summary">${L("The verdict will appear here once the verifier accepts it.", "검증기가 받아들이면 여기에 결론이 나타납니다.")}</p></section>`;
  }
  if (run.status === "needs_engineer") {
    const last = (run.refusals || []).slice(-1)[0];
    return `<section class="verdict pending"><div class="vhead"><span class="vlabel">${L("Needs an engineer", "엔지니어 확인 필요")}</span><h2>${L("The verifier refused three times", "검증기가 세 번 거부했습니다")}</h2></div>
      <p class="summary">${L("The agent could not back its conclusion with the evidence the playbook requires.", "에이전트가 플레이북이 요구하는 증거로 결론을 뒷받침하지 못했습니다.")}</p>
      ${last ? `<ul class="claims">${last.problems.map((p) => `<li><span></span><span>${esc(p.replace(/^rule: /, ""))}</span></li>`).join("")}</ul>` : ""}</section>`;
  }
  if (!d || run.status !== "awaiting_signoff") {
    return `<section class="verdict pending"><div class="vhead"><span class="vlabel">${L("No verdict", "결론 없음")}</span><h2>${L("Stopped before filing", "제출 전에 멈춤")}</h2></div>
      <p class="summary">${esc((run.status || "").replace("_", " "))}${run.error ? ": " + esc(run.error) : ""}</p></section>`;
  }
  const holds = d.actions.some((x) => x.type === "hold_lot" || x.type === "hold_chamber");
  const acts = d.actions.map((x) => `<span class="act ${esc(x.type)}">${esc(actionName(x.type))} ${esc(x.target)}</span>`).join(". ") + ".";
  const claim = (cl) => `<li><span><span class="chip" data-step="${evStep[cl.evidence_id] || ""}">${esc(cl.evidence_id)}</span></span><span>${esc(cl.statement)}</span></li>`;
  const top = d.claims.slice(0, 3).map(claim).join(""), rest = d.claims.slice(3).map(claim).join("");
  const tries = c.disposition_tries || 1;
  const verifier = KO()
    ? (tries > 1 ? `${term("Verifier", "검증기")}가 ${tries - 1}번 돌려보낸 뒤 받아들였습니다.` : `${term("Verifier", "검증기")}가 첫 제출에 받아들였습니다.`)
    : (tries > 1 ? `The ${term("Verifier", "verifier")} sent it back ${tries - 1} time${tries > 2 ? "s" : ""} before accepting it.` : `The ${term("Verifier", "verifier")} accepted it on the first try.`);
  return `<section class="verdict ${holds ? "stop" : "go"}">
    <div class="vhead">${term(holds ? "Hold" : "Release", holds ? L("Hold", "홀드") : L("Release", "진행"), "vlabel")}<h2>${esc(causeName(d.cause))}</h2></div>
    <div class="actions">${acts}</div>
    <p class="summary">${esc(d.summary)}</p>
    <ul class="claims">${top}</ul>
    ${rest ? `<details><summary>${L(`All ${d.claims.length} reasons`, `근거 ${d.claims.length}개 모두 보기`)}</summary><ul class="claims">${rest}</ul></details>` : ""}
    <div class="vmeta">${KO()
      ? `도구 호출 ${c.tool_calls}번, 추가 측정 ${c.measurements}번 (lot 지연 ${c.lot_delay_h}시간). ${verifier} 요약과 근거는 에이전트가 쓴 영어 원문입니다.`
      : `${c.tool_calls} tool calls, ${c.measurements} extra measurement${c.measurements === 1 ? "" : "s"} (${c.lot_delay_h} h of lot delay). ${verifier}`}</div>
    ${withSignoff ? signoffBlock(run) : ""}
  </section>`;
}

function disposition(d, evStep) {
  const acts = d.actions.map((x) => `<span class="act ${esc(x.type)}">${esc(actionName(x.type))} ${esc(x.target)}</span>`).join(". ") + ".";
  const claims = d.claims.map((c) => `<li><span><span class="chip" data-step="${evStep[c.evidence_id] || ""}">${esc(c.evidence_id)}</span></span><span>${esc(c.statement)}</span></li>`).join("");
  return `<div class="disposition"><div class="cause">${esc(causeName(d.cause))}</div>
    <div class="actions">${acts}</div><ul class="claims">${claims}</ul><p class="summary">${esc(d.summary)}</p></div>`;
}

function signoffBlock(run) {
  if (run.signoff) {
    const s = run.signoff;
    return `<div class="signoff"><span class="stamp ${s.decision}">${s.decision === "approve" ? L("Approved", "승인됨") : L("Rejected", "반려됨")}</span>
      <span class="soft"> ${esc(s.at)}${s.note ? `: ${esc(s.note)}` : ""}</span></div>`;
  }
  if (STATIC) return `<div class="signoff soft">${L("In the local version an engineer approves this here, or rejects it with a typed or spoken note and the agent investigates again.", "로컬 버전에서는 엔지니어가 여기서 승인하거나, 글이나 음성 메모를 남겨 반려합니다. 반려하면 에이전트가 그 메모를 받아 다시 조사합니다.")}</div>`;
  const reject = state.method === "agent" ? L("Reject and send back", "반려하고 재조사") : L("Reject", "반려");
  return `<div class="signoff"><b>${L("Engineer sign-off", "엔지니어 승인")}</b>
    <textarea id="signnote" placeholder="${L("Note for the record. If you reject, the agent gets this note and investigates again.", "기록용 메모. 반려하면 에이전트가 이 메모를 받아 다시 조사합니다.")}"></textarea>
    <div class="row"><button class="btn approve" id="approve">${L("Approve", "승인")}</button><button class="btn reject" id="reject">${reject}</button>
      <button class="btn ghost" id="mic" aria-pressed="false">${L("Speak a note", "음성 메모")}</button><span class="soft" id="micstate"></span></div></div>`;
}

function bindTraveler() {
  for (const b of document.querySelectorAll(".seg button")) b.onclick = () => { clearInterval(state.replayTimer); state.replay = null; state.method = b.dataset.m; loadRun(); };
  const live = $("#runlive");
  if (live) live.onclick = async () => {
    const r = await api("/api/live", { case: state.caseId });
    if (r.error) alertBar(r.error);
    state.run = null; loadRun();
  };
  const rp = $("#replay");
  if (rp) rp.onclick = () => {
    clearInterval(state.replayTimer);
    if (state.replay != null) { state.replay = null; renderTraveler(false); return; }
    state.replay = 0; renderTraveler(false);
    state.replayTimer = setInterval(() => {
      state.replay += 1;
      const total = state.run ? state.run.trace.length : 0;
      if (state.replay >= total) { clearInterval(state.replayTimer); state.replay = null; }
      renderTraveler(false);
      const steps = document.querySelectorAll("ol.route li");
      if (steps.length) steps[steps.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 1300);
  };
  for (const b of document.querySelectorAll("[data-top]")) b.onclick = () => document.querySelector(".verdict")?.scrollIntoView({ behavior: "smooth", block: "start" });
  for (const chip of document.querySelectorAll(".chip[data-step]")) chip.onclick = () => {
    const el = document.getElementById("step-" + chip.dataset.step);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
  };
  const ap = $("#approve"), rj = $("#reject");
  const send = async (decision) => {
    const note = $("#signnote").value;
    if (decision === "reject" && state.method === "agent" && !note.trim()) { $("#signnote").focus(); $("#signnote").placeholder = L("Write what the agent got wrong, so it can investigate again.", "에이전트가 무엇을 틀렸는지 적어 주세요. 그 내용으로 다시 조사합니다."); return; }
    const r = await api("/api/signoff", { method: state.method, case: state.caseId, decision, note });
    if (r.error) alertBar(r.error);
    if (r.rerun && r.rerun.error) alertBar(r.rerun.error);
    await loadCases(); loadRun();
  };
  const mic = $("#mic");
  if (mic) mic.onclick = () => (recorder ? stopRecording() : startRecording());
  if (ap) ap.onclick = () => send("approve");
  if (rj) rj.onclick = () => send("reject");
}
/* ---------------- voice notes (Muse Voice Transcribe) ---------------- */
let recorder = null;
async function startRecording() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } }); }
  catch (e) { $("#micstate").textContent = L("Microphone access was blocked. Allow it in the browser and try again.", "마이크 권한이 막혀 있습니다. 브라우저에서 허용한 뒤 다시 시도하세요."); return; }
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  proc.onaudioprocess = (ev) => chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  recorder = { ctx, stream, proc, src, chunks, rate: ctx.sampleRate };
  $("#mic").textContent = L("Stop and transcribe", "멈추고 받아쓰기"); $("#mic").setAttribute("aria-pressed", "true");
  $("#micstate").textContent = L("Listening…", "듣는 중…");
}
async function stopRecording() {
  const r = recorder; recorder = null;
  r.proc.disconnect(); r.src.disconnect(); r.stream.getTracks().forEach((t) => t.stop()); await r.ctx.close();
  $("#mic").textContent = L("Speak a note", "음성 메모"); $("#mic").setAttribute("aria-pressed", "false");
  $("#micstate").textContent = L("Transcribing with Muse Voice Transcribe…", "Muse Voice Transcribe로 받아쓰는 중…");
  const wav = toWav(r.chunks, r.rate, 16000);
  const res = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav }).then((x) => x.json());
  if (res.error) { $("#micstate").textContent = res.error; return; }
  const box = $("#signnote");
  box.value = (box.value.trim() ? box.value.trim() + " " : "") + res.text;
  $("#micstate").textContent = L("Transcribed by " + res.model + ". Edit if needed.", res.model + "로 받아썼습니다. 필요하면 고치세요.");
}
function toWav(chunks, inRate, outRate) {
  const total = chunks.reduce((n, c) => n + c.length, 0), input = new Float32Array(total);
  let o = 0; for (const c of chunks) { input.set(c, o); o += c.length; }
  const ratio = inRate / outRate, n = Math.floor(total / ratio), pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(Math.floor((i + 1) * ratio), total);
    let s = 0; for (let j = a; j < b; j++) s += input[j];
    const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), d = new DataView(buf);
  const w = (off, str) => { for (let i = 0; i < str.length; i++) d.setUint8(off + i, str.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, outRate, true);
  d.setUint32(28, outRate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

function alertBar(msg) {

function chart(ctx) {
  const W = 320, H = 190, P = { l: 34, r: 8, t: 10, b: 22 }, L = ctx.limits;
  const vals = ctx.points.map((p) => p.v).concat([L.lsl, L.usl]);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const [t0, t1] = ctx.window;
  const x = (t) => P.l + ((t - t0) / (t1 - t0)) * (W - P.l - P.r);
  const y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const hl = (v, color, dash, label) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-dasharray="${dash}"/><text x="${P.l - 4}" y="${y(v) + 3}" text-anchor="end">${label}</text>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wafer means over the last 24 hours">`;
  s += hl(L.usl, "var(--hold)", "4 3", L.usl) + hl(L.lsl, "var(--hold)", "4 3", L.lsl) + hl(L.ucl, "var(--amber)", "2 3", L.ucl) + hl(L.lcl, "var(--amber)", "2 3", L.lcl) + hl(L.target, "var(--line)", "", L.target);
  for (const t of ctx.pm) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${P.t}" y2="${H - P.b}" stroke="var(--slate)" stroke-dasharray="3 3"/><text x="${x(t) + 3}" y="${P.t + 9}" text-anchor="start">PM</text>`;
  for (const p of ctx.points.filter((p) => p.chamber !== ctx.chamber)) s += `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.2" fill="var(--line)"/>`;
  const mine = ctx.points.filter((p) => p.chamber === ctx.chamber);
  s += `<polyline fill="none" stroke="var(--ink)" stroke-width="1" points="${mine.map((p) => `${x(p.t)},${y(p.v)}`).join(" ")}"/>`;
  for (const p of mine) s += `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3" fill="var(--ink)"><title>${p.lot}: ${p.v} (${p.met})</title></circle>`;
  const last = mine[mine.length - 1];
  if (last && ctx.alarm.type !== "FDC" && last.lot === ctx.alarm.lot_id) s += `<circle cx="${x(last.t)}" cy="${y(last.v)}" r="6.5" fill="none" stroke="var(--hold)" stroke-width="2"/>`;
  s += `<text x="${P.l}" y="${H - 6}">−24 h</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${KO() ? "현재" : "now"}</text></svg>`;
  return s;
}
function heaterChart(ctx) {
  const W = 320, H = 90, P = { l: 34, r: 8, t: 8, b: 16 };
  const vs = ctx.heater.map((p) => p.v), lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1, [t0, t1] = ctx.window;
  const x = (t) => P.l + ((t - t0) / (t1 - t0)) * (W - P.l - P.r), y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Heater temperature readings">
    <polyline fill="none" stroke="var(--slate)" stroke-width="1.5" points="${ctx.heater.map((p) => `${x(p.t)},${y(p.v)}`).join(" ")}"/>
    <text x="${P.l - 4}" y="${y(hi - 1) + 3}" text-anchor="end">${(hi - 1).toFixed(0)}</text><text x="${P.l - 4}" y="${y(lo + 1) + 3}" text-anchor="end">${(lo + 1).toFixed(0)}</text></svg>`;
}

            ${KO() ? `<div class="cap">시나리오 설명과 근거 자료는 영어 원문입니다.</div>` : ""}

              <ul class="refs">${state.sources.public.map(([t, u, why]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>: ${esc(why)}</li>`).join("")}</ul>` : ""}</div>`

  "no more off-target lots than the best guide rule": "가장 좋은 가이드 규칙보다 이탈 lot이 많지 않음",
  "no out-of-spec lots caused (worst repeat)": "규격 이탈 lot 없음 (가장 나쁜 반복 기준)",
  "at most 3 monitor wafers per recovery on average": "복구당 모니터 웨이퍼 평균 3장 이하",
  "no_shift recipe change at most 1% (worst repeat)": "변화 없는 경우 레시피 변경 1% 이하 (가장 나쁜 반복 기준)",
};
const rstate = { cases: [], caseId: null, method: "agent", run: null, base: null, showTruth: false, loaded: false };

async function loadRecovery() {
  const data = await api("/api/recovery/cases");
  rstate.cases = data.cases || [];
  rstate.loaded = true;
  renderRecList();
  if (!rstate.caseId && rstate.cases.length) selectRec(rstate.cases[0].case_id);
}
function renderRecList() {
  const groups = KO() ? { dev: "개발 세트", holdout: "평가 세트", holdout2: "새 평가 세트" } : { dev: "Development", holdout: "Held-out", holdout2: "Fresh held-out" };
  let html = "";
  for (const [split, label] of Object.entries(groups)) {
    html += `<div class="group">${label}</div>`;
    for (const c of rstate.cases.filter((x) => x.split === split)) {
      const r = c.runs.agent;
      const tail = r ? L(`${r.off_target_lots} off target`, `이탈 lot ${r.off_target_lots}`) : L("no agent run yet", "에이전트 실행 전");
      html += `<button class="alarm-row" data-case="${c.case_id}" aria-current="${c.case_id === rstate.caseId}">
        <span class="kind">PM</span>
        <span class="what"><b>${esc(c.chamber)}, ${esc(c.pm.pm_id)}</b><span>${esc(tail)}</span></span><span></span></button>`;
    }
  }
  $("#rlist").innerHTML = html;
  for (const b of document.querySelectorAll("#rlist .alarm-row")) b.onclick = () => selectRec(b.dataset.case);
}
async function selectRec(id) {
  rstate.caseId = id; rstate.showTruth = false;
  renderRecList();
  await loadRec();
}
async function loadRec() {
  const [a, b] = await Promise.all([
    api(`/api/recovery/run?method=${rstate.method}&case=${rstate.caseId}`),
    api(`/api/recovery/run?method=keep_recipe&case=${rstate.caseId}`),
  ]);
  rstate.run = a.run; rstate.base = b.run;
  renderRec(); renderRecSide();
}
function recFinding(s) {
  const r = s.result || {};
  if (r.error) return `<span class="soft">${L("Refused", "거부됨")}: ${esc(r.error)}</span>`;
  switch (s.tool) {
    case "get_recovery_brief": {
      const pm = r.pm_record;
      return L(`${esc(pm.work)}. Parts replaced: ${esc(pm.parts_replaced.join(", ") || "none")}. Seasoning: ${esc(pm.seasoning)}. Pre-PM recipe ${r.pre_pm_recipe_time_s} s, baseline ${r.baseline_recipe_time_s_clean_chamber} s.`,
        `작업: ${esc(pm.work)}. 교체 부품: ${esc(pm.parts_replaced.join(", ") || "없음")}. 시즈닝: ${esc(pm.seasoning)}. PM 전 레시피 ${r.pre_pm_recipe_time_s}초, 기준 ${r.baseline_recipe_time_s_clean_chamber}초.`);
    }
    case "get_chamber_history": {
      const rows = r.earlier_pms.map((p) => `<tr><td>${esc(p.work)}</td><td>${esc(p.seasoning)}</td><td>${p.first_wafers_vs_later_A}</td><td>${p.thickness_slope_A_per_lot_first_40}</td></tr>`).join("");
      return `${L(`Previous cycle ended at ${r.mean_thickness_last_10_A} Å (last 10 lots).`, `이전 주기 마지막 10개 lot 평균 ${r.mean_thickness_last_10_A} Å.`)}
        <table class="mini"><tr><th>${L("Earlier PM", "이전 PM")}</th><th>${L("Seasoning", "시즈닝")}</th><th>${L("First wafers vs later, Å", "첫 웨이퍼 차이, Å")}</th><th>${L("Slope, Å per lot", "lot당 기울기, Å")}</th></tr>${rows}</table>`;
    }
    case "get_metrology_matching":
      return L(`On a 500 Å reference wafer MET01 read ${r.MET01_reads_A}, MET02 read ${r.MET02_reads_A}: MET02 − MET01 = <b>${r.MET02_minus_MET01_A} Å</b>.`,
        `500 Å 기준 웨이퍼를 MET01은 ${r.MET01_reads_A}, MET02는 ${r.MET02_reads_A}로 읽었습니다. 차이(MET02 − MET01) <b>${r.MET02_minus_MET01_A} Å</b>.`);
    case "run_monitor_wafer":
      return L(`${esc(r.wafer)} at ${r.time_s} s, measured on ${esc(r.met_tool)}: <b>${r.thickness_A} Å</b>. Run ${r.runs_since_pm} since PM.`,
        `${esc(r.wafer)}, ${r.time_s}초, ${esc(r.met_tool)} 측정: <b>${r.thickness_A} Å</b>. PM 후 ${r.runs_since_pm}번째 런.`);
    case "estimate_recipe": {
      const off = Object.entries(r.offsets_applied_A || {}).map(([k, v]) => `${k} ${v} Å`).join(", ");
      return L(`From ${esc(r.monitors_used.join(", "))}${off ? `, correcting ${off}` : ""}: rate ${r.rate_A_per_s} Å/s, <b>${r.recipe_time_s_for_500A} s</b> for 500 Å (${r.change_vs_pre_pm_pct}% vs pre-PM).`,
        `${esc(r.monitors_used.join(", "))} 기준${off ? `, ${off} 보정` : ""}: 증착 속도 ${r.rate_A_per_s} Å/s, 500 Å에 <b>${r.recipe_time_s_for_500A}초</b> (PM 전 대비 ${r.change_vs_pre_pm_pct}%).`);
    }
    default: return "";
  }
}
function recVerdict(run) {
  if (!run) return "";
  const sc = run.score || {}, c = run.costs || {};
  if (run.status !== "released") {
    return `<section class="verdict pending"><div class="vhead"><span class="vlabel">${L("Needs an engineer", "엔지니어 확인 필요")}</span><h2>${L("The verifier refused three times", "검증기가 세 번 거부했습니다")}</h2></div>
      <p class="summary">${L("An engineer takes over with the two-monitor rule; the extra chamber time is counted.", "엔지니어가 모니터 웨이퍼 2장 규칙으로 넘겨받고, 늘어난 장비 시간은 비용에 넣습니다.")}</p></section>`;
  }
  const rel = run.release;
  const claims = (rel.claims || []).map((cl) => `<li><span><span class="chip">${esc(cl.evidence_id)}</span></span><span>${esc(cl.statement)}</span></li>`).join("");
  const ctrl = KO()
    ? `EWMA λ ${rel.ewma_lambda}${rel.drift_A_per_lot ? `, 드리프트 선보정 lot당 ${rel.drift_A_per_lot} Å` : ""}. PM 전 대비 레시피 ${sc.recipe_change_pct}%.`
    : `EWMA λ ${rel.ewma_lambda}${rel.drift_A_per_lot ? `, drift pre-compensation ${rel.drift_A_per_lot} Å per lot` : ""}. Recipe ${sc.recipe_change_pct}% vs pre-PM.`;
  const outcome = KO()
    ? `다음 40개 lot: 관리 한계 이탈 <b>${sc.off_target_lots}</b>개, 규격 이탈 <b>${sc.out_of_spec_lots}</b>개 (시뮬레이션).`
    : `Next 40 lots: <b>${sc.off_target_lots}</b> outside control limits, <b>${sc.out_of_spec_lots}</b> out of spec (simulated).`;
  const meta = KO()
    ? `모니터 웨이퍼 ${c.monitor_wafers}장 (장비 정지 ${c.downtime_h}시간), 도구 호출 ${c.tool_calls}번, 제출 ${c.release_tries}번.${rstate.method === "agent" ? " 요약과 근거는 에이전트가 쓴 영어 원문입니다." : ""}`
    : `${c.monitor_wafers} monitor wafer${c.monitor_wafers === 1 ? "" : "s"} (${c.downtime_h} h of chamber time), ${c.tool_calls} tool calls, ${c.release_tries} release attempt${c.release_tries === 1 ? "" : "s"}.`;
  return `<section class="verdict go"><div class="vhead">${term("Release", L("Released", "해제"), "vlabel")}<h2>${L(`at ${rel.time_s} s`, `레시피 ${rel.time_s}초`)}</h2></div>
    <div class="actions">${ctrl}</div>
    <p class="summary">${outcome}</p>
    ${rstate.method === "agent" ? `<p class="summary">${esc(rel.summary)}</p><ul class="claims">${claims}</ul>` : ""}
    <div class="vmeta">${meta}</div></section>`;
}
function renderRec() {
  const c = rstate.cases.find((x) => x.case_id === rstate.caseId);
  if (!c) { $("#rtraveler").innerHTML = ""; return; }
  const run = rstate.run;
  const btns = Object.keys(REC_NAMES).map((m) => `<button aria-pressed="${m === rstate.method}" data-rm="${m}">${recName(m)}</button>`).join("");
  let html = `<div class="alarm-head"><div><h1>${L(`${esc(c.chamber)} after ${esc(c.pm.pm_id)}`, `${esc(c.chamber)}, ${esc(c.pm.pm_id)} 이후`)}</h1>
      <div class="sub">${L(`Held after PM. Pre-PM recipe ${c.pre_pm_time_s} s. Bring it back to 500 Å and release it.`, `PM 뒤 홀드된 상태입니다. PM 전 레시피 ${c.pre_pm_time_s}초. 500 Å로 되돌려 생산에 내보내야 합니다.`)}</div></div></div>
    <div class="methods"><div class="seg" role="group">${btns}</div></div>`;
  if (!run) {
    html += `<p class="empty">${L("No run for this method yet. Agent runs need the API key; see the README.", "이 방법은 아직 실행 기록이 없습니다. 에이전트 실행에는 API 키가 필요합니다 (README 참고).")}</p>`;
  } else {
    html += recVerdict(run);
    const notesAt = {};
    for (const n of run.notes || []) (notesAt[n.step ?? n.turn] ||= []).push(n.text);
    html += `<h3 class="routehead">${L("How it got there", "결론까지의 과정")}</h3><ol class="route">`;
    run.trace.forEach((s, i) => {
      const n = i + 1, r = s.result || {};
      const thought = (notesAt[n] || []).map((t) => `<div class="thought">${esc(t)}</div>`).join("");
      if (s.tool === "release_chamber") {
        const ok = r.accepted;
        html += `<li class="step ${ok ? "final" : "refused"}"><span class="n">${n}</span><div class="body">${thought}<div class="title"><b>${ok ? L("Released the chamber", "챔버 해제") : L("Verifier refused the release", "검증기가 해제를 거부함")}</b></div>
          ${ok ? "" : `<ul>${(r.problems || []).map((p) => `<li>${esc(p.replace(/^rule: /, ""))}</li>`).join("")}</ul>`}</div></li>`;
        return;
      }
      html += `<li class="step"><span class="n">${n}</span><div class="body">${thought}
        <div class="title"><b>${(REC_TOOLS[s.tool] || [s.tool, s.tool])[KO() ? 1 : 0]}</b>${r.evidence_id ? `<span class="chip">${r.evidence_id}</span>` : ""}</div>
        <div class="finding">${recFinding(s)}</div></div></li>`;
    });
    html += `</ol>`;
  }
  $("#rtraveler").innerHTML = html;
  for (const b of document.querySelectorAll("[data-rm]")) b.onclick = () => { rstate.method = b.dataset.rm; loadRec(); };
}
function recChart(run, base) {
  const W = 320, H = 200, P = { l: 34, r: 8, t: 10, b: 22 };
  const lots = run.outcome.lots, bl = base && base.outcome ? base.outcome.lots : [];
  const vals = lots.map((l) => l.true_A).concat(bl.map((l) => l.true_A), [sim_LSL, sim_USL]);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const x = (k) => P.l + ((k - 1) / (lots.length - 1)) * (W - P.l - P.r);
  const y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const hl = (v, color, dash) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-dasharray="${dash}"/><text x="${P.l - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Film thickness of the 40 lots after release">`;
  s += hl(sim_USL, "var(--hold)", "4 3") + hl(sim_LSL, "var(--hold)", "4 3") + hl(507, "var(--amber)", "2 3") + hl(493, "var(--amber)", "2 3") + hl(500, "var(--line)", "");
  if (bl.length && rstate.method !== "keep_recipe") s += `<polyline fill="none" stroke="var(--line)" stroke-width="1.5" points="${bl.map((l) => `${x(l.lot)},${y(l.true_A)}`).join(" ")}"/>`;
  s += `<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="${lots.map((l) => `${x(l.lot)},${y(l.true_A)}`).join(" ")}"/>`;
  for (const l of lots) if (Math.abs(l.true_A - 500) > 7) s += `<circle cx="${x(l.lot)}" cy="${y(l.true_A)}" r="3" fill="var(--hold)"><title>lot ${l.lot}: ${l.true_A}</title></circle>`;
  s += `<text x="${P.l}" y="${H - 6}">${L("lot 1", "lot 1")}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${L("lot 40", "lot 40")}</text></svg>`;
  return s;
}
const sim_LSL = 485, sim_USL = 515;
function renderRecSide() {
  const run = rstate.run;
  if (!run) { $("#rside").innerHTML = ""; return; }
  const c = run.costs || {};
  let html = "";
  if (run.outcome) html += `<section><h2>${L("The 40 lots after release", "해제 후 40개 lot")}</h2>${recChart(run, rstate.base)}
    <div class="cap">${L(`Black: ${recName(rstate.method)}. Grey: keeping the old recipe. Red dots: outside the control limits. True film, before metrology.`, `검정: ${recName(rstate.method)}. 회색: 기존 레시피 유지. 빨간 점: 관리 한계 이탈. 계측 전 실제 막 두께입니다.`)}</div></section>`;
  html += `<section><h2>${L("What it cost", "든 비용")}</h2><div class="costs">
    <span>${L("Monitor wafers", "모니터 웨이퍼")}</span><span>${c.monitor_wafers ?? 0}</span>
    <span>${L("Chamber time", "장비 정지 시간")}</span><span>${c.downtime_h ?? 0} h</span>
    <span>${L("Tool calls", "도구 호출")}</span><span>${c.tool_calls ?? 0}</span>
    ${run.tokens ? `<span>${L("Tokens", "토큰")}</span><span>${Number(run.tokens).toLocaleString()}</span>` : ""}
    ${run.model ? `<span>${L("Model", "모델")}</span><span>${esc(run.model)}</span>` : ""}</div></section>`;
  if (run.truth) {
    const sc = (REC_SCEN[run.truth.scenario] || [run.truth.scenario, run.truth.scenario])[KO() ? 1 : 0];
    html += `<section><h2>${L("Ground truth", "실제 원인")}</h2>${rstate.showTruth
      ? `<div class="truth"><b>${esc(sc)}.</b> ${esc(run.truth.explanation)}${KO() ? `<div class="cap">설명은 영어 원문입니다.</div>` : ""}</div>`
      : `<button class="btn ghost" id="rreveal">${L("Show what really happened", "실제 원인 보기")}</button><div class="cap">${L("Hidden from the agent and the tools. Only for review.", "에이전트와 도구에는 보이지 않는 정보입니다. 검토용으로만 엽니다.")}</div>`}</section>`;
  }
  html += `<section><div class="cap">${L("The recovery idea comes from Prof. Jang (The Catholic University of Korea): R2R models lose their footing after PM, so engineers re-center recipes by guide rules and experience.", "PM 후 복구 아이디어는 장재연 교수님(가톨릭대학교)께서 주셨습니다. R2R 모델은 PM 뒤에 기준을 잃기 쉬워서, 엔지니어가 가이드 규칙과 경험으로 레시피를 다시 맞춥니다.")}</div></section>`;
  $("#rside").innerHTML = html;
  const rv = $("#rreveal");
  if (rv) rv.onclick = () => { rstate.showTruth = true; renderRecSide(); };
}
function recBench(data) {
  const rec = data.recovery;
  if (!rec) return "";
  const cols = [["off_target_lots", L("Off-target lots", "관리 한계 이탈 lot")], ["out_of_spec_lots", L("Out-of-spec lots", "규격 이탈 lot")], ["avg_monitor_wafers", L("Monitor wafers per recovery", "복구당 모니터 웨이퍼")], ["avg_downtime_h", L("Chamber time, h", "장비 정지, 시간")], ["needs_engineer", L("Sent to an engineer", "엔지니어 이관")], ["no_shift_max_change_pct", L("Change when nothing changed, %", "변화 없을 때 레시피 변경, %")]];
  let html = `<h1 style="margin-top:40px">${L("Recovery after PM", "PM 후 복구")}</h1><p class="lead">${L("The same chamber, held after PM, recovered by each method. 40 production lots follow each release and are scored on the true film. Success criteria were written before any agent run (docs/RECOVERY.md).", "PM 뒤 홀드된 같은 챔버를 방법마다 복구합니다. 해제 뒤 40개 생산 lot을 실제 막 두께로 채점합니다. 성공 기준은 에이전트를 돌리기 전에 정했습니다 (docs/RECOVERY.md).")}</p>`;
  for (const [split, title] of [["holdout2", L("Fresh held-out recoveries (after the fix)", "새 평가 세트 (수정 후)")], ["holdout", L("Held-out recoveries", "평가 세트")], ["dev", L("Development recoveries", "개발 세트")]]) {
    const ms = Object.keys(rec[split] || {});
    if (!ms.length) continue;
    html += `<h2>${title}</h2><table class="sum"><tr><th>${L("Method", "방법")}</th>${cols.map((c) => `<th>${c[1]}</th>`).join("")}</tr>`;
    for (const m of ["agent", "agent_baseten", "monitor_rule", "reset_recipe", "keep_recipe"].filter((m) => rec[split][m])) {
      const d = rec[split][m], rep = d.repeats;
      const name = m === "agent_baseten" ? L("Agent (Muse Spark Open)", "에이전트 (Muse Spark Open)") : recName(m);
      html += `<tr class="${m}"><td>${name}${rep ? `<div class="soft" style="font-size:12px">${L("mean of 3 runs", "3회 평균")}</div>` : ""}</td>${cols.map(([k]) => `<td>${rep && rep[k] ? `${rep[k].mean}${rep[k].std ? ` ± ${rep[k].std}` : ""}` : d.summary[k] ?? "–"}</td>`).join("")}</tr>`;
    }
    html += `</table>`;
    const cr = rec[split + "_criteria"] || [];
    if (cr.length) html += `<ul class="legend">${cr.map((c) => `<li><b style="color:var(--${c.met ? "release" : "hold"})">${c.met ? L("Met", "충족") : L("Missed", "미달")}</b> ${esc((KO() && CRIT_KO[c.criterion]) || c.criterion)}: ${esc(String(c.value))}</li>`).join("")}</ul>`;
  }
  return html;
}

function showView(view) {
  for (const o of document.querySelectorAll("nav.tabs button")) o.setAttribute("aria-selected", o.dataset.view === view);
  for (const v of ["shift", "console", "recovery", "bench"]) $("#" + v).hidden = v !== view;
  if (view === "recovery") { if (!rstate.loaded) loadRecovery(); else { renderRecList(); renderRec(); renderRecSide(); } }
  if (view === "bench") renderBench();
  if (view === "shift") renderShift();
}
for (const t of document.querySelectorAll("nav.tabs button")) t.onclick = () => showView(t.dataset.view);
function setLang(lang) {

  try { const u = new URL(location.href); if (u.searchParams.has("lang")) { u.searchParams.set("lang", lang); history.replaceState(null, "", u); } } catch (e) {}
  applyStatic();
  renderList();
  if (!$("#shift").hidden) renderShift();
  if (!$("#bench").hidden) renderBench();
  if (!$("#recovery").hidden && rstate.loaded) { renderRecList(); renderRec(); renderRecSide(); }
  if (!$("#console").hidden && state.caseId) {
    if (state.method === "compare") renderCompare(); else renderTraveler(false);
    renderSide();
  }
}
for (const b of document.querySelectorAll(".lang button")) b.onclick = () => setLang(b.dataset.lang);
applyStatic();
